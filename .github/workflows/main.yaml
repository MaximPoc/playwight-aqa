name: CI Testing

on:
  push:
    branches:
      - '*'
  pull_request:
    types: ['opened', 'synchronize', 'reopened']

jobs:
  test-cypress:
    name: 'Cypress e2e tests in Docker'
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-20.9.0-chrome-118.0.5993.88-1-ff-118.0.2-edge-118.0.2088.46-1
      options: --user 1001
    env:
      HOME: ${{ github.workspace }}
      npm_config_cache: ${{ github.workspace }}/.npm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./cypress-project
        run: npm ci

      - name: Run Cypress tests inside Docker
        working-directory: ./cypress-project
        run: npx cypress run --browser chrome

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cypress-screenshots
          path: |
            cypress-project/cypress/screenshots/
            cypress-project/cypress/videos/
          retention-days: 3

  tests-playwright:
    name: 'PW e2e tests in Docker'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.39.0-jammy
    env:
      CI: true
      BASE_URL: https://qauto.forstudy.space
      HTTP_CREDENTIALS_USERNAME: guest
      HTTP_CREDENTIALS_PASSWORD: welcome2qauto
      USER_EMAIL: aqa-test-fixture@gmail.com
      USER_PASSWORD: Qwerty123
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests inside Docker
        run: npm run playwright:test:ci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
